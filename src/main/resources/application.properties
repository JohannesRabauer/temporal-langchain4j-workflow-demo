# HTTP
quarkus.http.port=8081

# Temporal (defaults for running the app on the host via `./mvnw quarkus:dev`
# against the Dockerized Temporal server; overridden by env vars for the
# containerized `app` service in docker-compose.yml)
quarkus.temporal.connection.target=localhost:7233
quarkus.temporal.namespace=default
quarkus.temporal.worker.task-queue=vacation-approval

# LangChain4j / Ollama (same host-vs-container split as above)
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-name=llama3.1

# Logging
quarkus.log.category."io.temporal".level=INFO
